<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | NewzWave</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <nav class="nav container">
        <a class="brand" href="index.html">NewzWave</a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="categiores.html">Categories</a>
          <a href="bookmark.html">Bookmarks</a>
          <a href="login.html">Login</a>
        </div>
      </nav>
    </header>

    <main class="auth-shell container">
      <section class="form-card">
        <h2>Welcome back</h2>
        <p>Sign in to save stories and personalize your reading feed.</p>
        <form id="loginForm">
          <input name="email" type="email" placeholder="Email" autocomplete="email" required />
          <input name="password" type="password" placeholder="Password" autocomplete="current-password" required />
          <button class="submit-btn" type="submit">Login</button>
        </form>
        <p class="form-footnote">New here? <a href="register.html">Create an account</a></p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
